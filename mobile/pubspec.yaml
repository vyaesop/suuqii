name: suuqii
description: Inventory & shop management for small Ethiopian retail shops.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  cached_network_image: ^3.4.0
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3
  decimal: ^3.0.0
  dio: ^5.4.0
  drift: ^2.18.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.1
  go_router: ^14.0.0
  google_fonts: ^8.1.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.3
  riverpod_annotation: ^2.3.5
  sentry_flutter: ^9.20.0
  share_plus: ^10.1.0
  shared_preferences: ^2.2.3
  sqlite3_flutter_libs: ^0.5.20
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.10
  custom_lint: ^0.6.4
  drift_dev: ^2.18.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/NotoSansEthiopic-OFL.txt
  # Bundled (not runtime-fetched) so Amharic renders identically on every
  # device, offline included — cheap/old Androids ship incomplete Ethiopic
  # system fonts, and Inter has no Ethiopic glyphs at all. Wired up as
  # fontFamilyFallback in app_theme.dart.
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansEthiopic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
