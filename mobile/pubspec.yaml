name: suuqii
description: Inventory & shop management for small Ethiopian retail shops.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state + routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0

  # local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # http
  dio: ^5.4.0
  retrofit: ^4.1.0

  # models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # misc
  uuid: ^4.4.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  decimal: ^3.0.0
  sentry_flutter: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.10
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
