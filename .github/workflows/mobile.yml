name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Matches the version the app is developed against; satisfies the
          # pubspec constraint (flutter >=3.24.0, Dart ^3.5.0).
          flutter-version: 3.44.0
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code (riverpod/freezed/drift/json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        # pubspec has `generate: true` so pub get already does this, but being
        # explicit keeps the step order obvious and fails fast on ARB errors.
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
